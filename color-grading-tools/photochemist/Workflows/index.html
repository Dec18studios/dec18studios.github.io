  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;}\nhtml{scroll-behavior:smooth;}\nbody{font-family:var(--sans); color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; line-height:1.5;}\na{color:var(--cyan); text-decoration:none;} a:hover{color:var(--ink);}\n.glyph-defs{position:absolute; width:0; height:0; overflow:hidden;}\n\n/* ---------- main brand bar (matches dec18studios site topbar) ---------- */\n:root{--topbar-h:66px;}\n.topbar{position:sticky; top:0; z-index:60; height:var(--topbar-h); backdrop-filter:blur(14px); background:color-mix(in oklab,var(--bg) 84%,transparent); border-bottom:1px solid var(--line-soft);}\n.topbar-row{max-width:1180px; height:var(--topbar-h); margin:0 auto; padding:0 40px; display:flex; align-items:center; justify-content:space-between; gap:24px;}\n.tb-brand{display:flex; align-items:center;}\n.tb-logo{display:block; height:34px; aspect-ratio:862/380; background:linear-gradient(96deg,var(--red),var(--magenta) 30%,var(--blue) 54%,var(--cyan) 76%,var(--green)); -webkit-mask:url(\"22bade98-8f97-428f-90ad-f87d44b403ff\") left center/contain no-repeat; mask:url(\"22bade98-8f97-428f-90ad-f87d44b403ff\") left center/contain no-repeat;}\n.tb-links{display:flex; gap:26px; align-items:center;}\n.tb-links a{font-family:var(--sans); font-size:15px; color:var(--ink-dim); font-weight:500; transition:color .16s;}\n.tb-links a:hover{color:var(--ink);}\n.tb-links a.cta{color:var(--bg); background:var(--ink); border-radius:8px; padding:8px 15px; font-weight:600; white-space:nowrap;}\n.tb-links a.cta:hover{background:oklch(0.86 0.006 264);}\n@media(max-width:760px){.tb-links a:not(.cta){display:none;}}\n\n/* ---------- section sub-nav ---------- */\n.nav{position:sticky; top:var(--topbar-h); z-index:40; backdrop-filter:blur(14px); background:color-mix(in oklab,var(--bg) 82%,transparent); border-bottom:1px solid var(--line-soft);}\n.nav-in{max-width:1180px; margin:0 auto; padding:16px 40px; display:flex; align-items:center; justify-content:space-between; gap:24px;}\n.brand{font-family:var(--mono); font-size:15px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink); display:flex; align-items:center; gap:12px;}\n.brand .dot{width:9px; height:9px; border-radius:50%; background:var(--rainbow,linear-gradient(90deg,var(--orange),var(--cyan))); box-shadow:0 0 12px -1px var(--cyan);}\n.nav-links{display:flex; gap:6px; flex-wrap:wrap;}\n.nav-links a{font-family:var(--mono); font-size:13px; letter-spacing:0.04em; color:var(--ink-faint); padding:7px 12px; border-radius:8px; transition:.15s;}\n.nav-links a:hover{color:var(--ink); background:var(--bg-2);}\n@media(max-width:860px){.nav-links{display:none;}}\n\n/* ---------- layout shell ---------- */\n.wrap{max-width:1180px; margin:0 auto; padding:0 40px;}\n.section{padding:96px 0; border-top:1px solid var(--line-soft);}\n.section:first-of-type{border-top:0;}\n.col{max-width:760px;}\n.eyebrow{font-family:var(--mono); font-size:15px; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-faint); display:inline-flex; align-items:center; gap:14px;}\n.eyebrow::before{content:\"\"; width:32px; height:2px; background:var(--accent,var(--cyan));}\n.eyebrow .n{color:var(--accent,var(--cyan)); font-weight:600;}\nh1{font-family:var(--display); font-weight:800; letter-spacing:-0.025em; line-height:1.0; font-size:clamp(46px,7vw,88px); text-wrap:balance;}\nh2{font-family:var(--display); font-weight:700; letter-spacing:-0.022em; line-height:1.04; font-size:clamp(34px,4.4vw,54px); margin-top:22px; text-wrap:balance;}\nh3{font-family:var(--display); font-weight:600; letter-spacing:-0.015em; font-size:26px; margin-top:8px;}\n.lede{font-size:clamp(19px,2vw,23px); line-height:1.55; color:var(--ink-dim); margin-top:26px; max-width:60ch; text-wrap:pretty;}\n.lede strong{color:var(--ink); font-weight:600;} .lede .hl{color:var(--accent,var(--cyan)); font-weight:600;}\np.body{font-size:18px; line-height:1.62; color:var(--ink-dim); margin-top:18px; max-width:64ch; text-wrap:pretty;}\np.body strong{color:var(--ink); font-weight:600;}\n.kicker{font-family:var(--mono); font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:8px;}\n\n/* ---------- hero ---------- */\n.hero{padding:110px 0 84px; position:relative; overflow:hidden;}\n.hero::before{content:\"\"; position:absolute; inset:0; background:radial-gradient(80% 60% at 78% -10%, oklch(0.24 0.03 250) 0%, transparent 60%); pointer-events:none;}\n.hero-tag{margin-top:30px; display:flex; gap:10px; flex-wrap:wrap;}\n.chip{font-family:var(--mono); font-size:13px; letter-spacing:0.04em; color:var(--ink-dim); border:1px solid var(--line); border-radius:99px; padding:8px 15px; display:inline-flex; gap:9px; align-items:center;}\n.chip b{color:var(--accent,var(--cyan)); font-weight:600;}\n\n/* ---------- lab stage strip ---------- */\n.labstrip{margin-top:40px; position:relative; display:flex; justify-content:space-between; gap:10px;}\n.labstrip::before{content:\"\"; position:absolute; left:4%; right:4%; top:42px; height:2px; background:var(--line); z-index:0;}\n.lstage{position:relative; z-index:1; flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; --sacc:var(--grey);}\n.lstage .ic{width:82px; height:82px; display:grid; place-items:center; border:1.5px solid var(--sacc); border-radius:18px; color:var(--sacc); background:color-mix(in oklab,var(--sacc) 12%,var(--bg-1)); box-shadow:0 0 28px -12px var(--sacc);}\n.lstage .ic svg{width:44px; height:44px;}\n.lstage .nm{font-family:var(--display); font-weight:600; font-size:18px; color:var(--ink); line-height:1.08;}\n.lstage .sb{font-family:var(--mono); font-size:12.5px; letter-spacing:0.01em; color:var(--ink-faint); line-height:1.25; max-width:15ch;}\n@media(max-width:820px){.labstrip{flex-wrap:wrap; justify-content:flex-start;} .labstrip::before{display:none;} .lstage{flex:0 0 auto; width:calc(33.33% - 8px);}}\n\n/* two-column model row */\n.modelgrid{display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:46px;}\n@media(max-width:820px){.modelgrid{grid-template-columns:1fr;}}\n.mcard{background:var(--bg-1); border:1px solid var(--line); border-radius:16px; padding:28px 30px;}\n.mcard h4{font-family:var(--mono); font-size:14px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent,var(--cyan)); font-weight:600;}\n.mcard .t{font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:-0.015em; margin-top:12px; line-height:1.1;}\n.mcard p{font-size:16.5px; line-height:1.58; color:var(--ink-dim); margin-top:12px;}\n.mcard.dg{--accent:var(--digital);} .mcard.pc{--accent:var(--cyan);}\n\n/* ============================================================\n   RESOLVE NODE GRAPH\n   ============================================================ */\n.graph{margin-top:44px; background:oklch(0.145 0.008 264); border:1px solid var(--line); border-radius:18px; padding:38px 34px 30px; position:relative; overflow-x:auto;\n  background-image:linear-gradient(oklch(0.185 0.008 264 / .5) 1px,transparent 1px),linear-gradient(90deg,oklch(0.185 0.008 264 / .5) 1px,transparent 1px); background-size:34px 34px;}\n.graph-cap{display:flex; align-items:baseline; gap:14px; margin-bottom:8px; flex-wrap:wrap;}\n.graph-cap .gc-k{font-family:var(--mono); font-size:12.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-faint);}\n.graph-cap .gc-t{font-family:var(--mono); font-size:13px; color:var(--ink-dim);}\n.flow{display:flex; align-items:flex-start; gap:0; min-width:max-content; padding:22px 6px 10px;}\n\n/* node */\n.rnode{position:relative; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:8px;}\n.rn-label{font-family:var(--sans); font-size:14px; font-weight:500; color:var(--ink-dim); max-width:132px; height:18px; line-height:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center;}\n.rn-box{position:relative; width:132px; background:linear-gradient(180deg,oklch(0.255 0.008 264),oklch(0.202 0.008 264)); border:1px solid oklch(0.36 0.008 264); border-radius:6px; padding:6px 6px 0; box-shadow:0 6px 18px -9px #000, inset 0 1px 0 oklch(0.42 0.01 264 / .35);}\n.rn-thumb{height:80px; border-radius:3px; background:#0c0c0e; position:relative; overflow:hidden;}\n.rn-img{width:100%; height:100%; object-fit:cover; display:block;}\n.rn-bar{height:3px; margin:4px 1px 0; border-radius:2px; background:var(--clip-orange);}\n.rn-foot{display:flex; align-items:center; gap:8px; padding:5px 4px 6px;}\n.rn-num{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--ink); background:oklch(0.16 0.008 264); border-radius:3px; padding:2px 7px; letter-spacing:0.04em;}\n.rn-fx{width:19px; height:19px; border:1.4px solid var(--ink-faint); border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:10px; color:var(--ink-dim); font-weight:600;}\n.rn-tag{margin-top:2px; font-family:var(--mono); font-size:12px; letter-spacing:0.02em; color:var(--acc,var(--cyan)); text-align:center; max-width:150px;}\n/* io nubs */\n/* outputs: one set (green RGB + blue alpha squares) on every node */\n.rn-out{position:absolute; right:-6px; width:11px; height:11px; border-radius:2px;}\n.rn-out.rgb{top:30px; background:oklch(0.82 0.19 138); box-shadow:0 0 8px -1px oklch(0.82 0.19 138 / .8);}\n.rn-out.alpha{top:84px; background:oklch(0.66 0.15 245); box-shadow:0 0 8px -1px oklch(0.66 0.15 245 / .7);}\n/* inputs: green triangle = RGB, blue triangle = alpha */\n.rn-in{position:absolute; left:-9px; width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent;}\n.rn-in.rgb{border-left:10px solid oklch(0.78 0.17 138);}\n.rn-in.alpha{border-left:10px solid oklch(0.66 0.15 245);}\n.rn-in.r1{top:30px;} .rn-in.r2{top:84px;}\n.rn-in.p1{top:14px;} .rn-in.p2{top:42px;} .rn-in.p3{top:70px;} .rn-in.p4{top:98px;}\n.rnode.hero-node .rn-box{box-shadow:0 0 0 1.5px color-mix(in oklab,var(-- ight:1.6; color:var(--ink-dim); max-width:60ch;}\n.foot .fmeta{margin-top:30px; font-family:var(--mono); font-size:13px; letter-spacing:0.04em; color:var(--ink-faint); display:flex; gap:22px; flex-wrap:wrap;}\n.foot .price{color:var(--ink);}\n\n@media print{ .nav{position:static;} .graph{overflow:visible;} body{background:#fff;} }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<svg class=\"glyph-defs\" aria-hidden=\"true\"><defs>\n  <symbol id=\"g-scene\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"16\" cy=\"16\" r=\"5.5\"><\u002Fcircle><path d=\"M16 3v3M16 26v3M3 16h3M26 16h3M6.5 6.5l2 2M25.5 6.5l-2 2M6.5 25.5l2-2M25.5 25.5l-2-2\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"g-neg\" viewBox=\"0 0 32 32\"><rect x=\"4\" y=\"9\" width=\"24\" height=\"14\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Frect><g fill=\"currentColor\"><rect x=\"7\" y=\"5\" width=\"3\" height=\"2.4\" rx=\"0.6\"><\u002Frect><rect x=\"14.5\" y=\"5\" width=\"3\" height=\"2.4\" rx=\"0.6\"><\u002Frect><rect x=\"22\" y=\"5\" width=\"3\" height=\"2.4\" rx=\"0.6\"><\u002Frect><rect x=\"7\" y=\"24.6\" width=\"3\" height=\"2.4\" rx=\"0.6\"><\u002Frect><rect x=\"14.5\" y=\"24.6\" width=\"3\" height=\"2.4\" rx=\"0.6\"><\u002Frect><rect x=\"22\" y=\"24.6\" width=\"3\" height=\"2.4\" rx=\"0.6\"><\u002Frect><\u002Fg><\u002Fsymbol>\n  <symbol id=\"g-develop\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4h8M13.5 4v7l-6.4 12.4a3 3 0 0 0 2.7 4.4h12.4a3 3 0 0 0 2.7-4.4L18.5 11V4\"><\u002Fpath><path d=\"M9.2 21h13.6\" stroke-width=\"1.6\" opacity=\"0.8\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"g-printer\" viewBox=\"0 0 32 32\"><g fill=\"currentColor\"><rect x=\"7.5\" y=\"13\" width=\"4.2\" height=\"12\" rx=\"1\"><\u002Frect><rect x=\"13.9\" y=\"8\" width=\"4.2\" height=\"17\" rx=\"1\"><\u002Frect><rect x=\"20.3\" y=\"17\" width=\"4.2\" height=\"8\" rx=\"1\"><\u002Frect><\u002Fg><line x1=\"6\" y1=\"26.5\" x2=\"26\" y2=\"26.5\" stroke=\"currentColor\" stroke-width=\"1.6\" opacity=\"0.7\"><\u002Fline><\u002Fsymbol>\n  <symbol id=\"g-project\" viewBox=\"0 0 32 32\"><rect x=\"3\" y=\"12\" width=\"8\" height=\"8\" rx=\"1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Frect><path d=\"M11 14L26 8v16l-15-6Z\" fill=\"currentColor\" opacity=\"0.24\"><\u002Fpath><path d=\"M11 14L26 8v16l-15-6Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><line x1=\"28.5\" y1=\"6\" x2=\"28.5\" y2=\"26\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline><\u002Fsymbol>\n<\u002Fdefs><\u002Fsvg>\n\n<header class=\"topbar\">\n  <div class=\"topbar-row\">\n    <a class=\"tb-brand\" href=\"https://dec18studios.com/\" target=\"_top\" aria-label=\"Dec. 18 Studios, home\"><span class=\"tb-logo\"><\u002Fspan><\u002Fa>\n    <nav class=\"tb-links\">\n      <a href=\"https://tools.dec18studios.com/color-grading-tools/\" target=\"_top\">All tools<\u002Fa>\n      <a href=\"https://tools.dec18studios.com/color-grading-tools/photochemist/\" target=\"_top\">PhotoChemist<\u002Fa>\n      <a href=\"https://dec18studios.com/account/digital-products\" target=\"_top\">Account<\u002Fa>\n      <a class=\"cta\" href=\"https://tools.dec18studios.com/color-grading-tools/photochemist/#subscribe\" target=\"_top\">Get it · $47.34/yr<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<nav class=\"nav\" data-comment-anchor=\"20b41e6590-nav\"><div class=\"nav-in\">\n  <span class=\"brand\"><span class=\"dot\"><\u002Fspan>PhotoChemist · Workflows<\u002Fspan>\n  <div class=\"nav-links\">\n    <a href=\"#model\">The lab<\u002Fa>\n    <a href=\"#w1\">1 · Mono-node<\u002Fa>\n    <a href=\"#w2\">2 · PL Injector<\u002Fa>\n    <a href=\"#w3\">3 · Sandwich<\u002Fa>\n    <a href=\"#w4\">4 · Digital to print<\u002Fa>\n    <a href=\"#w5\">5 · Neg to digital<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fnav>\n\n<!-- ================= HERO ================= -->\n<header class=\"hero\"><div class=\"wrap col\">\n  <p class=\"eyebrow\"><span class=\"n\">Field guide<\u002Fspan> &nbsp;Setting up the nodes<\u002Fp>\n  <h1>Five ways to run<br>the lab in Resolve.<\u002Fh1>\n  <p class=\"lede\">The last guide covered what lives <em>inside<\u002Fem> PhotoChemist: the sliders, the film science, designing your own stocks. This one is about the part everyone asked for next, <strong>how you actually wire it into a node tree<\u002Fstrong> and grade with it.<\u002Fp>\n  <div class=\"hero-tag\">\n    <span class=\"chip\"><b>4.5<\u002Fb> primary workflows<\u002Fspan>\n    <span class=\"chip\">Mono-node to full digital intermediate<\u002Fspan>\n    <span class=\"chip\">A <b>100-year-old<\u002Fb> lab, modelled honestly<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fheader>\n\n<!-- ================= MENTAL MODEL ================= -->\n<section class=\"section\" id=\"model\" data-comment-anchor=\"95cdc1e2df-section\"><div class=\"wrap\">\n  <div class=\"col\">\n    <p class=\"eyebrow\"><span class=\"n\">00<\u002Fspan> The mental model<\u002Fp>\n    <h2>Film is not graded. It is developed in a lab.<\u002Fh2>\n    <p class=\"lede\">In a normal digital grade you work backward from the display. PhotoChemist asks you to think forward through chemistry instead: the values coming in are a <strong>frozen impulse of light<\u002Fstrong>, and the node simulates what film would have done with it.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"modelgrid\">\n    <div class=\"mcard dg\">\n      <h4>The digital habit<\u002Fh4>\n      <p class=\"t\">Work backward from the monitor.<\u002Fp>\n      <p>Camera log lands as RGB triplets. An input transform brings every clip into one working space so lift, gamma, gain, curves, qualifiers and power windows all feel consistent. Then an output transform, a CST, OpenDRT or a print LUT, crushes it down to the display. You define the endpoint first and build back toward the shot.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"mcard pc\">\n      <h4>The PhotoChemist rethink<\u002Fh4>\n      <p class=\"t\">Work forward through the chemistry.<\u002Fp>\n      <p>Treat the incoming values as light hitting a camera negative. Expose the silver layers, develop the negative, push printer lights through the developed stock to expose a print, develop the print, then project it. Everything you do <strong>before<\u002Fstrong> the node is solving it on set. Everything inside is the lab.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"labstrip\" style=\"margin-top:56px;\">\n    <div class=\"lstage\" style=\"--sacc:var(--grey);\"><span class=\"ic\"><svg><use href=\"#g-scene\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"nm\">Scene<\u002Fspan><span class=\"sb\">on set · lens · lights · balance<\u002Fspan><\u002Fdiv>\n    <div class=\"lstage\" style=\"--sacc:var(--orange);\"><span class=\"ic\"><svg><use href=\"#g-neg\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"nm\">Camera neg<\u002Fspan><span class=\"sb\">expose the silver layers<\u002Fspan><\u002Fdiv>\n    <div class=\"lstage\" style=\"--sacc:var(--orange);\"><span class=\"ic\"><svg><use href=\"#g-develop\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"nm\">Develop<\u002Fspan><span class=\"sb\">turn activation into dye<\u002Fspan><\u002Fdiv>\n    <div class=\"lstage\" style=\"--sacc:var(--yellow);\"><span class=\"ic\"><svg><use href=\"#g-printer\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"nm\">Printer lights<\u002Fspan><span class=\"sb\">R/G/B valves through the neg<\u002Fspan><\u002Fdiv>\n    <div class=\"lstage\" style=\"--sacc:var(--cyan);\"><span class=\"ic\"><svg><use href=\"#g-develop\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"nm\">Print<\u002Fspan><span class=\"sb\">expose + develop print stock<\u002Fspan><\u002Fdiv>\n    <div class=\"lstage\" style=\"--sacc:var(--cyan);\"><span class=\"ic\"><svg><use href=\"#g-project\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"nm\">Projection<\u002Fspan><span class=\"sb\">bulb subtracts to your eye<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout pc\" style=\"--accent:var(--cyan);\">\n    <span class=\"co-k\">Choose this first<\u002Fspan>\n    <p>The final image is a <strong>subtraction from the projector light<\u002Fstrong> you pick. A warm carbon arc bulb and a neutral xenon give you two different images from the same grade, because you are subtracting from a different quality of light. Choosing the bulb is as consequential as choosing your DRT, so choose it early.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"callout\" style=\"--accent:var(--orange);\">\n    <span class=\"co-k\">Commit these too<\u002Fspan>\n    <div class=\"co-body\">\n      <p>Before you time a single frame, three fixed choices bracket the whole pipeline: your <strong>camera negative stock<\u002Fstrong>, your <strong>print stock<\u002Fstrong>, and the <strong>development controls<\u002Fstrong> (bleach bypass, developer push, and the rest). Pull them from the presets or design your own in the stock editor. Like the projector bulb, these set the in and out points that everything else is subtracted from, so lock them before you start grading.<\u002Fp>\n      <a class=\"detail-btn\" href=\"PhotoChemist - Stocks &amp; Development.html\"><span>Detailed guide · choosing and designing stocks<\u002Fspan><span class=\"arw\">→<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ================= WORKFLOW 1 ================= -->\n<section class=\"section wf w1\" id=\"w1\"><div class=\"wrap\">\n  <div class=\"col\">\n    <div class=\"wf-head\"><span class=\"wf-num\">01<\u002Fspan><div><p class=\"eyebrow\"><span class=\"n\">Workflow<\u002Fspan> Mono-node<\u002Fp><span class=\"wf-meta\">Neg to Print · one node<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <h2>One node is the whole lab.<\u002Fh2>\n    <p class=\"body\">Conform the footage to linear, keep its original camera primaries, and a single PhotoChemist node runs the entire chain: expose, develop, print and project. This is the classical color-timing position. Your one grading control is <strong>printer lights<\u002Fstrong>: picture light passing through dichroic filters that split red, green and blue, each opening and closing like a valve. Lock your stocks, then grade in printer points.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"graph\">\n    <div class=\"graph-cap\"><span class=\"gc-k\">Node tree<\u002Fspan><span class=\"gc-t\">conform → PhotoChemist (Neg to Print) → display<\u002Fspan><\u002Fdiv>\n    <div class=\"flow\" data-comment-anchor=\"d8c215193e-div\">\n      <div class=\"rnode\"><span class=\"rn-label\">Conform · Linear<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"aad238e2-37bc-47fb-b551-c8e26a02d2bd\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">15<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--grey);\">on-set fix<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 35 45 20 78 20\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode hero-node\"><span class=\"rn-label\">PhotoChemist<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"e70e5279-8b82-46c6-843d-030dca6ea4ab\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">01<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb p1\"><\u002Fspan><span class=\"rn-in alpha p2\"><\u002Fspan><span class=\"rn-in rgb p3\"><\u002Fspan><span class=\"rn-in alpha p4\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\">Neg to Print<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">Display out<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"c1ff0c33-1aa9-491e-9707-f99477997bb4\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">out<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stagemap\">\n      <span class=\"smtag on\" style=\"--sacc:var(--grey);\">Scene<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--orange);\">Camera neg<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--orange);\">Develop<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--yellow);\">Printer lights<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--cyan);\">Print<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--cyan);\">Projection<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"pquote\">Every lab stage, <span class=\"em\">packed inside one node.<\u002Fspan><\u002Fp>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ================= WORKFLOW 2 ================= -->\n<section class=\"section wf w2\" id=\"w2\"><div class=\"wrap\">\n  <div class=\"col\">\n    <div class=\"wf-head\"><span class=\"wf-num\">02<\u002Fspan><div><p class=\"eyebrow\"><span class=\"n\">Workflow<\u002Fspan> PL Injector<\u002Fp><span class=\"wf-meta\">Mono-node · external printer lights<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <h2>Grade the printer lights without touching the node.<\u002Fh2>\n    <p class=\"body\">Same mono-node, but you would rather not open PhotoChemist every time. A <strong>PL Injector<\u002Fstrong> node, plus a power-window node beside it, generates a feed that PhotoChemist reads exactly as if you had moved the printer lights inside. Now your panel, qualifiers and power windows all drive real printer-light modulation: brighten the bathtub, place a skin tone, ride the gain, all still expressed as printer points.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"graph\">\n    <div class=\"graph-cap\"><span class=\"gc-k\">Node tree<\u002Fspan><span class=\"gc-t\">PL Injector + power window → second input of the mono-node<\u002Fspan><\u002Fdiv>\n    <div class=\"flow\">\n      <div class=\"feeder\">\n        <div class=\"feeder-row\">\n          <div class=\"rnode\"><span class=\"rn-label\">PL Injector<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"899f6bba-c9e3-43c8-b991-d5a49c314bd4\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">08<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"rwire w30\"><svg viewBox=\"0 0 46 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C21 41 25 41 42 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div class=\"rnode active\"><span class=\"rn-label\">Printer lights · window<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"543eabac-44d0-4f7e-9bdb-2b696c8637c1\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">14<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--yellow);\">power window feed<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"feeder-elbow\"><\u002Fdiv>\n        <span class=\"feeder-port\">→ PhotoChemist 2nd input<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"rwire g\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 35 45 20 78 20\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode hero-node\"><span class=\"rn-label\">PhotoChemist<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"e70e5279-8b82-46c6-843d-030dca6ea4ab\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">01<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb p1\"><\u002Fspan><span class=\"rn-in alpha p2\"><\u002Fspan><span class=\"rn-in rgb p3\"><\u002Fspan><span class=\"rn-in alpha p4\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\">Neg to Print<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">Display out<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"c1ff0c33-1aa9-491e-9707-f99477997bb4\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">out<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stagemap\">\n      <span class=\"smtag on\" style=\"--sacc:var(--grey);\">Scene<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--orange);\">Camera neg<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--orange);\">Develop<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--yellow);\">Printer lights · driven externally<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--cyan);\">Print<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--cyan);\">Projection<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout\" style=\"--accent:var(--yellow);\">\n    <span class=\"co-k\">Still timing<\u002Fspan>\n    <p>You have not left color timing yet. You are still working printer lights to build the positive print, you have just given yourself a friendlier surface to do it on. Think of it as workflow <strong>1A<\u002Fstrong>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ================= WORKFLOW 3 ================= -->\n<section class=\"section wf w3\" id=\"w3\"><div class=\"wrap\">\n  <div class=\"col\">\n    <div class=\"wf-head\"><span class=\"wf-num\">03<\u002Fspan><div><p class=\"eyebrow\"><span class=\"n\">Workflow<\u002Fspan> The Sandwich<\u002Fp><span class=\"wf-meta\">Neg → grade → Print · digital intermediate<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <h2>Grade in the middle, between the neg and the print.<\u002Fh2>\n    <p class=\"body\">Two matched PhotoChemist nodes wrap a normal grade. The first is set to <strong>Neg Scan<\u002Fstrong>. Film Negative Space converts that scan into a gradeable positive, a cineon log-ish image you can push with ordinary tools. You do your work in the middle. A second Film Negative Space flips digital back to negative, and the last node prints. The two conversion nodes are fully invertible no-ops, so the negative and print stocks stay committed while you grade the digital intermediate exactly where a colorist historically sat.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"graph\" data-comment-anchor=\"d98dfe506f-div\">\n    <div class=\"graph-cap\"><span class=\"gc-k\">Node tree<\u002Fspan><span class=\"gc-t\">Neg Scan → FNS Neg to Digital → grade → FNS Digital to Neg → Print Only<\u002Fspan><\u002Fdiv>\n    <div class=\"flow\">\n      <div class=\"rnode\"><span class=\"rn-label\">NegOnly PC<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"3cd07c67-92ad-41fd-b3e8-fb6a9bd77d1e\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">02<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb p1\"><\u002Fspan><span class=\"rn-in alpha p2\"><\u002Fspan><span class=\"rn-in rgb p3\"><\u002Fspan><span class=\"rn-in alpha p4\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--orange);\">Neg Scan<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire g\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">Neg › Digital<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"154037ca-318c-4d6b-8584-1efba6709550\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">03<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--green);\">FNS · invert<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire g\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode hero-node\"><span class=\"rn-label\">Grade · your work<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"fdf89570-144d-4d30-9e5e-cc970080d754\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">11<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--magenta);\">DI · normal tools<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire g\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">Neg › Digital<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"9dbb7cb3-1338-4bbc-8236-0590384d3502\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">04<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--green);\">FNS · fold back<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire g\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 35 45 20 78 20\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">Print Only PC<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"39fe4331-5b23-42a2-9f12-8f01c25300af\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">05<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb p1\"><\u002Fspan><span class=\"rn-in alpha p2\"><\u002Fspan><span class=\"rn-in rgb p3\"><\u002Fspan><span class=\"rn-in alpha p4\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\">Print Only<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stagemap\">\n      <span class=\"smtag on\" style=\"--sacc:var(--orange);\">Neg Scan<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--green);\">Invert to DI<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--magenta);\">Grade here<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--green);\">Fold to neg<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--cyan);\">Print<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout\" style=\"--accent:var(--green);\">\n    <span class=\"co-k\">The choices are locked<\u002Fspan>\n    <p>The negative was chosen on set, the print stock was chosen after. Your job is the part in between: <strong>grade the intermediate and get the best possible image<\u002Fstrong>, without ever reopening the stocks.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ================= WORKFLOW 4 ================= -->\n<section class=\"section wf w4\" id=\"w4\"><div class=\"wrap\">\n  <div class=\"col\">\n    <div class=\"wf-head\"><span class=\"wf-num\">04<\u002Fspan><div><p class=\"eyebrow\"><span class=\"n\">Workflow<\u002Fspan> Digital to Print<\u002Fp><span class=\"wf-meta\">No negative · print side only<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <h2>No negative at all. Just borrow the print.<\u002Fh2>\n    <p class=\"body\">Take your conformed DaVinci Wide Gamut linear image, invert and prep it with Film Negative Space so PhotoChemist accepts it, then run <strong>Print Only<\u002Fstrong>. Nothing happens on the negative side. You get print sensitivity, print dye and print H&amp;D, plus printer lights and the projector bulb. It is the same idea as dropping a 2383 print LUT onto digital footage, except it is live and every control is yours.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"graph\">\n    <div class=\"graph-cap\"><span class=\"gc-k\">Node tree<\u002Fspan><span class=\"gc-t\">DWG linear → FNS prep → PhotoChemist (Print Only) → display<\u002Fspan><\u002Fdiv>\n    <div class=\"flow\">\n      <div class=\"rnode\"><span class=\"rn-label\">Conform · DWG linear<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"aad238e2-37bc-47fb-b551-c8e26a02d2bd\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">16<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--grey);\">any digital image<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire g\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">Neg › Digital · prep<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"154037ca-318c-4d6b-8584-1efba6709550\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">06<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--green);\">FNS · into print space<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 35 45 20 78 20\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode hero-node\"><span class=\"rn-label\">Print Only PC<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"36448899-73dc-4b9b-af7b-b941080f227e\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">07<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb p1\"><\u002Fspan><span class=\"rn-in alpha p2\"><\u002Fspan><span class=\"rn-in rgb p3\"><\u002Fspan><span class=\"rn-in alpha p4\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\">Print Only<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">Display out<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"c1ff0c33-1aa9-491e-9707-f99477997bb4\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">out<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stagemap\">\n      <span class=\"smtag off\">Camera neg<\u002Fspan>\n      <span class=\"smtag off\">Develop<\u002Fspan>\n      <span class=\"smtag off\">Scan<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--yellow);\">Printer lights<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--cyan);\">Print<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--cyan);\">Projection<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"pquote\">The physical analog is a <span class=\"em\">film-out:<\u002Fspan> a digital master recorded to negative purely so it can be printed.<\u002Fp>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ================= WORKFLOW 5 ================= -->\n<section class=\"section wf w5\" id=\"w5\"><div class=\"wrap\">\n  <div class=\"col\">\n    <div class=\"wf-head\"><span class=\"wf-num\">05<\u002Fspan><div><p class=\"eyebrow\"><span class=\"n\">Workflow<\u002Fspan> Neg to Digital<\u002Fp><span class=\"wf-meta\">Shoot film · finish modern<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <h2>Shoot film, finish digital.<\u002Fh2>\n    <p class=\"body\">Keep the authentic negative and its grain, halation and layer crosstalk. The first node is set to <strong>Neg Scan<\u002Fstrong>. Film Negative Space inverts neg to digital into a cineon-log positive, you grade in the middle with normal Wide Gamut controls, then hand off to <strong>OpenDRT<\u002Fstrong> as your display transform. Shape the intermediate so it reads to OpenDRT like DaVinci Wide intermediate, and out you go. It is the mirror image of the print workflow: real film capture, modern digital finish. Swap OpenDRT for a 2383 print LUT any time and nothing about the approach changes.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"graph\">\n    <div class=\"graph-cap\"><span class=\"gc-k\">Node tree<\u002Fspan><span class=\"gc-t\">Neg Scan → FNS Neg to Digital → grade → OpenDRT<\u002Fspan><\u002Fdiv>\n    <div class=\"flow\">\n      <div class=\"rnode\"><span class=\"rn-label\">NegOnly PC<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"fb2e821f-be5d-40b5-9a3a-df93678f2e8e\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">13<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb p1\"><\u002Fspan><span class=\"rn-in alpha p2\"><\u002Fspan><span class=\"rn-in rgb p3\"><\u002Fspan><span class=\"rn-in alpha p4\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--orange);\">Neg Scan<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire g\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">Neg › Digital<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"10277eba-e771-4fc0-8c72-9c6f0158e221\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">09<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--green);\">FNS · invert<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire g\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode hero-node\"><span class=\"rn-label\">Grade · your work<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"3ffb3690-59ff-432d-875d-6bc5e73fd40d\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">12<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--magenta);\">DI · normal tools<\u002Fspan><\u002Fdiv>\n      <div class=\"rwire\"><svg viewBox=\"0 0 82 120\" preserveAspectRatio=\"none\"><path d=\"M5 35 C37 41 45 41 78 35\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"rnode\"><span class=\"rn-label\">OpenDRT<\u002Fspan><div class=\"rn-box\"><div class=\"rn-thumb\"><img class=\"rn-img\" src=\"c1ff0c33-1aa9-491e-9707-f99477997bb4\" alt=\"\"><\u002Fdiv><div class=\"rn-bar\"><\u002Fdiv><div class=\"rn-foot\"><span class=\"rn-num\">10<\u002Fspan><span class=\"rn-fx\">fx<\u002Fspan><\u002Fdiv><span class=\"rn-in rgb r1\"><\u002Fspan><span class=\"rn-in alpha r2\"><\u002Fspan><span class=\"rn-out rgb\"><\u002Fspan><span class=\"rn-out alpha\"><\u002Fspan><\u002Fdiv><span class=\"rn-tag\" style=\"--acc:var(--digital);\">display transform<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stagemap\">\n      <span class=\"smtag on\" style=\"--sacc:var(--orange);\">Camera neg<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--orange);\">Develop<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--amber);\">Neg Scan<\u002Fspan>\n      <span class=\"smtag on\" style=\"--sacc:var(--magenta);\">Grade here<\u002Fspan>\n      <span class=\"smtag off\">Print<\u002Fspan>\n      <span class=\"smtag off\">Projection<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout\" style=\"--accent:var(--magenta);\">\n    <span class=\"co-k\">Get them talking<\u002Fspan>\n    <p>The trick is matching the handoff. Shape the scan so its contrast sits where OpenDRT expects DaVinci Wide intermediate, roughly the bulk of the image between 20 and 60 on the scopes. Once the two <strong>talk to each other cleanly<\u002Fstrong>, commit the negative and the DRT, and grade in the middle.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ================= CLOSE ================= -->\n<footer class=\"foot\"><div class=\"wrap col\">\n  <p class=\"eyebrow\"><span class=\"n\">In short<\u002Fspan> The through-line<\u002Fp>\n  <h2 style=\"font-size:clamp(30px,4vw,46px);\">Once the negative, the print and the projector are defined, do not change them. Grade in the middle.<\u002Fh2>\n  <p class=\"fp\" style=\"margin-top:26px;\">That is four and a half ways to honor a photochemical system that ran for a hundred years before any of this went digital. Use only the print side. Use only the negative side into OpenDRT. Put both together and grade the intermediate. Run a pure mono-node, or a mono-node driven by your own printer-light rig off to the side. Anything you do before PhotoChemist is answering one question: what if something had changed on set?<\u002Fp>\n  <div class=\"fmeta\">\n    <span>PhotoChemist · dec18 studios<\u002Fspan>\n    <span class=\"price\">Tools suite · $47.34 · one year of updates<\u002Fspan>\n    <span>Demos on the site and in the plugin manager<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Ffooter>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
